services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: file:./dev.db
      JWT_SECRET: dorm-demo-secret-change-me
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend/src:/app/backend/src
      # Persist the local SQLite demo database on the host so resets are reproducible.
      - ./database/prisma:/app/database/prisma
    # Applies migrations only (no reseed on startup). Run `pnpm demo:setup` on the
    # host first, or seed once inside the container with:
    #   docker compose run --rm backend sh -c "cd /app/database && pnpm exec ts-node prisma/seed.ts"
    command: sh -c "pnpm --filter database prisma:migrate:prod && pnpm --filter backend dev"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_IO_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/frontend/src
    command: pnpm --filter frontend dev